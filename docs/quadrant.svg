<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" role="img" aria-label="BlackGit gives you both Perforce's exclusive file locks and Git's local branches">
  <title>Perforce's locks, Git's branches</title>
  <desc>A two-by-two matrix: horizontal axis local branches and local commits, vertical axis exclusive file locks. Shared folder has neither, Perforce has only locks, Git only branches, BlackGit both.</desc>
  <defs>
    <style>
      .f { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
           Arial, sans-serif; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas,
           "DejaVu Sans Mono", monospace; }
      .cell { fill: #292c3c; stroke: #414559; stroke-width: 1.5; }
      .hi  { fill: #1f2335; stroke: #8caaee; stroke-width: 2.5; }
    </style>
  </defs>

  <rect x="0" y="0" width="760" height="470" rx="14" fill="#303446"/>

  <!-- headline -->
  <text x="380" y="44" class="f" font-size="26" font-weight="600" fill="#c6d0f5" text-anchor="middle">Perforce's locks. Git's branches.</text>
  <text x="380" y="70" class="f" font-size="14" fill="#a6adc8" text-anchor="middle">Both in one repository — not either/or</text>

  <!-- quadrant: locks + branches = BlackGit -->
  <rect x="410" y="110" width="310" height="140" rx="10" class="hi"/>
  <text x="565" y="146" class="f" font-size="21" font-weight="700" fill="#8caaee" text-anchor="middle">BlackGit</text>
  <text x="565" y="174" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">Take a file exclusively, like p4 edit,</text>
  <text x="565" y="194" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">and open as many branches as you like</text>
  <text x="565" y="224" class="m" font-size="12" fill="#a6d189" text-anchor="middle">git black lock · git checkout -b</text>

  <!-- quadrant: locks, no branches = Perforce -->
  <rect x="60" y="110" width="310" height="140" rx="10" class="cell"/>
  <text x="215" y="150" class="f" font-size="21" font-weight="700" fill="#e5c890" text-anchor="middle">Perforce</text>
  <text x="215" y="178" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">Locks are great, but branching</text>
  <text x="215" y="198" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">is a ceremony</text>
  <text x="215" y="222" class="f" font-size="13" fill="#a6adc8" text-anchor="middle">you must check out to edit one line</text>

  <!-- quadrant: branches, no locks = Git -->
  <rect x="410" y="280" width="310" height="140" rx="10" class="cell"/>
  <text x="565" y="320" class="f" font-size="21" font-weight="700" fill="#a6d189" text-anchor="middle">Git</text>
  <text x="565" y="348" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">Branches are free, but nothing stops</text>
  <text x="565" y="368" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">two people editing one .umap</text>
  <text x="565" y="392" class="f" font-size="13" fill="#a6adc8" text-anchor="middle">binary merges break</text>

  <!-- quadrant: neither -->
  <rect x="60" y="280" width="310" height="140" rx="10" class="cell"/>
  <text x="215" y="326" class="f" font-size="21" font-weight="700" fill="#e78284" text-anchor="middle">Shared folder</text>
  <text x="215" y="354" class="f" font-size="13" fill="#c6d0f5" text-anchor="middle">No file locks, no history</text>
  <text x="215" y="376" class="f" font-size="13" fill="#a6adc8" text-anchor="middle">— just a network drive</text>

  <!-- axis labels -->
  <text x="390" y="444" class="f" font-size="14" fill="#a6adc8" text-anchor="middle">local branches and local commits →</text>
  <text x="30" y="245" class="f" font-size="14" fill="#a6adc8" text-anchor="middle" transform="rotate(-90 30 245)">exclusive file locks →</text>
</svg>