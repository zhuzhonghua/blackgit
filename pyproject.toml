[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackgit"
version = "0.0.1"
description = "blackgit sparse/promisor git client for monorepos"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "EPL-2.0 OR GPL-2.0-or-later" }

[project.scripts]
git-black = "blackgitcli:main"
blackgit = "blackgitcli:main"

[tool.setuptools]
py-modules = ["blackgitcli"]
